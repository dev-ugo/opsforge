apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: demo-web
  name: demo-web
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web
  strategy: {}
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
      - image: nginx:stable
        name: nginx
        resources: {}
status: {}
