apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsforge-api
  labels:
    app: opsforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opsforge-api
  template:
    metadata:
      labels:
        app: opsforge-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/dev-ugo/opsforge-api@sha256:1123b3194de4cee445bdb4e6ab356ea8f5e3cf3077d1cd7cdf62091fb148f695
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2